# MOTH-50 E-023 R1: E-011 with encoder LR 3e-5 (H1 ablation).
# Pre-registered 2026-11-21 in experiments/next-experiments.md; NOT AUTHORIZED
# until the E-017 calibration set exists and the owner gives a go-ahead.
# Everything else is E-011: base+6, 40,000 steps (~2.97 epochs), EMA 0.9998,
# gold x50, the same mixture. The only variable is lr_encoder 3e-5 (E-011 used
# 1e-4); lr_head stays 3e-4. Two seeds: run --seed 0 and --seed 1.

[model]
preset = "base"
head_blocks = 6
vocab_size = 1024
checkpointing = true
init = "../../data/raw/whisper-base-encoder.pt"
identity_heads = true

[data]
tokenizer = "../../data/tokenizer/moth_bpe.model"
max_seconds = 192
max_clips = 32
augment = true
seed = 0
eval_max_seconds = 192
eval_max_clips = 32

[[data.train]]
manifest = "../../../moth-stt/data/manifests/cv_it_train_clean50.jsonl"
shards = "../../data/shards/cv_it_train"
repeat = 1

[[data.train]]
manifest = "../../../moth-stt/data/manifests/cv_it_train_noisy50.jsonl"
shards = "../../data/shards/cv_it_noisy50"
repeat = 1

[[data.train]]
manifest = "../../../moth-stt/data/manifests/mls_it_train.jsonl"
shards = "../../data/shards/mls_it_train"
repeat = 1

[[data.train]]
manifest = "../../../moth-stt/data/manifests/ls_en_train.jsonl"
shards = "../../data/shards/ls_en_train"
repeat = 1

[[data.train]]
manifest = "../../data/manifests/spliced_it_en.jsonl"
shards = "../../data/shards/spliced_it_en"
repeat = 1

# Gold v1.0.0: the full 1,413 clips, repeated like E-028's base gold (x50).
[[data.train]]
manifest = "../../../moth-cs-dataset/manifests/train.jsonl"
shards = "../../data/shards/gold-train"
repeat = 50

[[data.dev]]
manifest = "../../../moth-stt/data/manifests/mls_it_dev.jsonl"
shards = "../../data/shards/mls_it_dev"

[[data.dev]]
manifest = "../../../moth-stt/data/manifests/ls_en_dev.jsonl"
shards = "../../data/shards/ls_en_dev"

[optimizer]
lr_head = 3e-4
lr_encoder = 3e-5
betas = [0.9, 0.98]
eps = 1e-8
weight_decay = 0.01
grad_clip = 1.0

[schedule]
warmup_steps = 1000
min_factor = 0.05

[train]
epochs = 4
max_steps = 40000
log_every = 50
eval_every_steps = 4000
checkpoint_every_steps = 100
empty_cache_every = 10
autocast = "bf16"
seed = 0
# EMA horizon ~5,000 steps; the dev loop evaluates the EMA weights when present.
ema_decay = 0.9998
