[project]
name = "moth-50"
version = "0.0.1"
description = "MOTH-50 — a 50 MB-class Italian+English code-switching speech-to-text model"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "num2words",
]

[dependency-groups]
dev = [
    "huggingface-hub>=2.4.0",
    "pytest",
    "ruff",
    "sentencepiece",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
# Vendored Moth code stays byte-identical to upstream (see vendor/moth-stt/PROVENANCE.md).
exclude = ["vendor/moth-stt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "vendor/moth-stt", "tools"]
