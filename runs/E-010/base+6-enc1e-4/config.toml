# MOTH-50 E-010: encoder-LR screen. Identical to base6.toml (the E-003 recipe)
# except optimizer.lr_encoder = 1e-4 instead of 3e-5 (review P2 range 3e-5–1e-4).
# Arms: --head-blocks 4 and 6, --max-steps 4000, seed 0; compare with the E-003
# base+4 / base+6 runs at 3e-5. Pre-registered in experiments/next-experiments.md.

[model]
preset = "base"
head_blocks = 6
vocab_size = 1024
checkpointing = true
# Pretrained Whisper-base encoder (docs/architecture-options.md §5.2). The file
# lives in gitignored data/raw: build it once with
# tools/convert_whisper_encoder.py (training/README.md "Pretrained initialization").
init = "../../data/raw/whisper-base-encoder.pt"
# Extra blocks start as exact identity (review P3): at step 0 base+0/+2/+4/+6
# are the same function, so the screen measures depth and nothing else.
identity_heads = true

[data]
tokenizer = "../../data/tokenizer/moth_bpe.model"
max_seconds = 192
max_clips = 32
augment = true
seed = 0
eval_max_seconds = 192
eval_max_clips = 32

[[data.train]]
manifest = "../../../moth-stt/data/manifests/cv_it_train_clean50.jsonl"
shards = "../../data/shards/cv_it_train"
repeat = 1

[[data.train]]
manifest = "../../../moth-stt/data/manifests/cv_it_train_noisy50.jsonl"
shards = "../../data/shards/cv_it_noisy50"
repeat = 1

[[data.train]]
manifest = "../../../moth-stt/data/manifests/mls_it_train.jsonl"
shards = "../../data/shards/mls_it_train"
repeat = 1

[[data.train]]
manifest = "../../../moth-stt/data/manifests/ls_en_train.jsonl"
shards = "../../data/shards/ls_en_train"
repeat = 1

[[data.train]]
manifest = "../../data/manifests/spliced_it_en.jsonl"
shards = "../../data/shards/spliced_it_en"
repeat = 1

# Gold v1.0.0: the full 1,413 clips, repeated like E-028's base gold (x50).
# The term addenda are inside v1.0.0 here; a separate x20 manifest is a
# mixture experiment, not a silent default.
[[data.train]]
manifest = "../../../moth-cs-dataset/manifests/train.jsonl"
shards = "../../data/shards/gold-train"
repeat = 50

[[data.dev]]
manifest = "../../../moth-stt/data/manifests/mls_it_dev.jsonl"
shards = "../../data/shards/mls_it_dev"

[[data.dev]]
manifest = "../../../moth-stt/data/manifests/ls_en_dev.jsonl"
shards = "../../data/shards/ls_en_dev"

[optimizer]
# E-010 arm: the top of the review P2 screen. Everything else is E-003.
lr_head = 3e-4
lr_encoder = 1e-4
betas = [0.9, 0.98]
eps = 1e-8
weight_decay = 0.01
grad_clip = 1.0

[schedule]
warmup_steps = 1500
min_factor = 0.05

[train]
epochs = 4
max_steps = 0
log_every = 50
eval_every_steps = 1000
# Recovery cadence, not a protocol parameter: ~100 steps is a few minutes, so a
# thermal/memory stop loses at most that. --resume ckpt_last.pt continues exactly.
checkpoint_every_steps = 100
empty_cache_every = 10
autocast = "bf16"
seed = 0
